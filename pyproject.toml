[project]
name = "ensp-mcp"
version = "0.2.0"
description = "FastMCP server for local Huawei eNSP network operations"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp==4.0.11",
    "mcp==2.3.0",
    "pydantic==2.13.5",
    "jsonschema>=4.26.0,<5",
]

[dependency-groups]
dev = ["uv==0.12.23"]

[tool.uv]
package = false
link-mode = "copy"
